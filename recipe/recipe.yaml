schema_version: 1

context:
  version: "0.12.1"
  python_min: "3.12"

package:
  name: easydynamics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/E/EasyDynamics/easydynamics-${{ version }}.tar.gz
  sha256: 6e7e243b5e4ab3fd97a648dbb904f2cf3eafe0c9da4b52f30edf86813251d255

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - versioningit
    - pip
  run:
    - python >=${{ python_min }}
    - easyscience >=2.5.1
    - numpy
    - scipy
    - scipp
    - h5py
    - matplotlib-base
    - pooch
    - darkdetect
    - plopp
    - ipywidgets
    - ipympl
    - sympy

tests:
  - python:
      imports:
        - easydynamics
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: QENS data analysis
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/easyscience/dynamics-lib
  documentation: https://easyscience.github.io/dynamics-lib

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
